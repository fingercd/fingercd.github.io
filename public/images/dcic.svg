<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img">
  <title>AI image forgery analysis pipeline</title>
  <desc>A vision-language model classifies and explains an image while a segmentation model localizes forged regions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3ed"/>
      <stop offset="1" stop-color="#f8fbfd"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#56331f" flood-opacity=".12"/>
    </filter>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0l8 4-8 4z" fill="#c15b35"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="36" fill="url(#bg)"/>
  <text x="70" y="84" fill="#172033" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="700">Image forgery analysis</text>
  <text x="70" y="122" fill="#5d6677" font-family="Inter,Arial,sans-serif" font-size="19">Global reasoning + pixel-level localization</text>

  <g filter="url(#s)">
    <rect x="70" y="196" width="270" height="320" rx="24" fill="#fff"/>
    <rect x="98" y="226" width="214" height="164" rx="16" fill="#dbe6ec"/>
    <path d="M98 347l54-52 47 38 37-27 76 59v25H98z" fill="#7894a4"/>
    <circle cx="257" cy="267" r="19" fill="#f3b47b"/>
    <rect x="208" y="302" width="62" height="62" rx="12" fill="none" stroke="#c15b35" stroke-width="5" stroke-dasharray="9 7"/>
    <text x="98" y="430" fill="#172033" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700">Input image</text>
    <text x="98" y="462" fill="#5d6677" font-family="Inter,Arial,sans-serif" font-size="16">unknown authenticity</text>
  </g>

  <path d="M360 356h78" stroke="#c15b35" stroke-width="4" marker-end="url(#a)"/>

  <g filter="url(#s)">
    <rect x="460" y="174" width="310" height="364" rx="26" fill="#fff"/>
    <rect x="496" y="215" width="238" height="98" rx="16" fill="#172033"/>
    <text x="520" y="250" fill="#f2b49c" font-family="Consolas,monospace" font-size="14">VLM / QLoRA</text>
    <text x="520" y="280" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="17">classify · reason · attribute</text>
    <rect x="496" y="337" width="238" height="98" rx="16" fill="#f4e6df"/>
    <text x="520" y="372" fill="#9b4526" font-family="Consolas,monospace" font-size="14">RESNET34-UNET</text>
    <text x="520" y="402" fill="#172033" font-family="Inter,Arial,sans-serif" font-size="17">segment · localize · refine</text>
    <text x="496" y="481" fill="#5d6677" font-family="Inter,Arial,sans-serif" font-size="15">Independent modules, shared output contract</text>
  </g>

  <path d="M790 356h78" stroke="#c15b35" stroke-width="4" marker-end="url(#a)"/>

  <g filter="url(#s)">
    <rect x="890" y="196" width="240" height="320" rx="24" fill="#fff"/>
    <rect x="918" y="226" width="184" height="132" rx="14" fill="#28333b"/>
    <path d="M1013 251c35 3 56 29 46 61-8 25-35 36-63 23-22-11-25-40-10-60 7-10 15-20 27-24z" fill="#ef8354" fill-opacity=".78"/>
    <text x="918" y="405" fill="#172033" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">FORGED</text>
    <text x="918" y="437" fill="#5d6677" font-family="Inter,Arial,sans-serif" font-size="15">mask + rationale</text>
    <rect x="918" y="463" width="116" height="28" rx="14" fill="#fff0e9"/>
    <text x="976" y="482" text-anchor="middle" fill="#a34b27" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600">structured JSON</text>
  </g>
  <text x="70" y="603" fill="#5d6677" font-family="Inter,Arial,sans-serif" font-size="16">DCIC · 48-hour multimodal engineering challenge</text>
</svg>
