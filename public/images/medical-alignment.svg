    <text x="568" y="268" fill="#172033" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">Shared space</text>
    <text x="568" y="298" fill="#5d6677" font-family="Inter,Arial,sans-serif" font-size="16">SigLIP-style contrastive alignment</text>
    <g transform="translate(578 338)">
      <circle cx="25" cy="34" r="13" fill="#6757a6"/>
      <circle cx="72" cy="17" r="10" fill="#7b9fc1"/>
      <circle cx="116" cy="52" r="12" fill="#c97957"/>
      <circle cx="158" cy="24" r="11" fill="#6757a6"/>
