<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img">
  <title>Multimodal clinical prediction alignment</title>
  <desc>MRI, regional volume, and clinical text are aligned into a shared representation for downstream prediction.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3f1fb"/>
      <stop offset="1" stop-color="#f8fbfd"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#27204b" flood-opacity=".12"/>
    </filter>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0l8 4-8 4z" fill="#6757a6"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="36" fill="url(#bg)"/>
  <text x="70" y="84" fill="#172033" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="700">Multimodal clinical alignment</text>
  <text x="70" y="122" fill="#5d6677" font-family="Inter,Arial,sans-serif" font-size="19">Frozen encoders · shared representation · leakage-aware evaluation</text>

  <g filter="url(#s)">
    <rect x="70" y="180" width="250" height="112" rx="22" fill="#fff"/>
    <circle cx="127" cy="236" r="34" fill="#d9d5ec"/>
    <path d="M109 238c8-25 29-31 39-9 8 17-4 33-20 31-13-1-23-10-19-22z" fill="none" stroke="#6757a6" stroke-width="4"/>
    <text x="180" y="228" fill="#172033" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">3D MRI</text>
    <text x="180" y="256" fill="#5d6677" font-family="Inter,Arial,sans-serif" font-size="15">visual encoder</text>
  </g>
  <g filter="url(#s)">
    <rect x="70" y="318" width="250" height="112" rx="22" fill="#fff"/>
    <g transform="translate(104 346)">
      <rect width="12" height="46" rx="4" fill="#a69dcc"/>
      <rect x="19" y="14" width="12" height="32" rx="4" fill="#6757a6"/>
      <rect x="38" y="5" width="12" height="41" rx="4" fill="#8a7cbd"/>
      <rect x="57" y="22" width="12" height="24" rx="4" fill="#c5bee1"/>
    </g>
    <text x="180" y="366" fill="#172033" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">AAL volume</text>
    <text x="180" y="394" fill="#5d6677" font-family="Inter,Arial,sans-serif" font-size="15">regional structure</text>
  </g>
  <g filter="url(#s)">
    <rect x="70" y="456" width="250" height="112" rx="22" fill="#fff"/>
    <path d="M107 491h62M107 507h48M107 523h56" stroke="#6757a6" stroke-width="6" stroke-linecap="round"/>
    <text x="180" y="504" fill="#172033" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">Clinical text</text>
    <text x="180" y="532" fill="#5d6677" font-family="Inter,Arial,sans-serif" font-size="15">BioClinicalBERT</text>
  </g>

  <path d="M340 236C430 236 430 300 506 318" fill="none" stroke="#6757a6" stroke-width="4" marker-end="url(#a)"/>
  <path d="M340 374h165" fill="none" stroke="#6757a6" stroke-width="4" marker-end="url(#a)"/>
  <path d="M340 512c90 0 90-64 166-82" fill="none" stroke="#6757a6" stroke-width="4" marker-end="url(#a)"/>

  <g filter="url(#s)">
