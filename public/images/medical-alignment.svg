    <text x="990" y="300" fill="#cfc9ea" font-family="Inter,Arial,sans-serif" font-size="16">DOWNSTREAM</text>
    <text x="990" y="352" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">Diagnosis</text>
    <text x="990" y="390" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">Brain age</text>
    <path d="M990 424h108" stroke="#6757a6" stroke-width="4"/>
    <text x="990" y="458" fill="#aeb8c3" font-family="Inter,Arial,sans-serif" font-size="14">nocog protocol</text>
