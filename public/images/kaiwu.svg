    <text x="101" y="510" fill="#5d6677" font-family="Inter,Arial,sans-serif" font-size="15">partially observable navigation environment</text>
  </g>

  <path d="M490 362h76" stroke="#2f6f57" stroke-width="4" marker-end="url(#a)"/>

  <g filter="url(#s)">
    <rect x="588" y="182" width="280" height="360" rx="26" fill="#fff"/>
    <text x="624" y="229" fill="#172033" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">Three-head policy</text>
    <rect x="624" y="260" width="208" height="58" rx="16" fill="#e7f2ec"/>
    <text x="646" y="296" fill="#2f6f57" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600">Actor: movement</text>
    <rect x="624" y="333" width="208" height="58" rx="16" fill="#e7f2ec"/>
    <text x="646" y="369" fill="#2f6f57" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600">Actor: flash</text>
